- baseInfo:
    api_name: 新增用户
    url: /users/add
    method: post
    header:
      Content-Type: application/json; charset=utf-8
  testCase:
    - case_name: 新增用户成功
      # 用 json 传参，Content-Type 必须与之一致；用 data 会被编码成 form-urlencoded
      json:
        firstName: 自动化
        lastName: 测试
        age: 18
      validation:
        - code: 201
        - eq: {'firstName': '自动化', 'lastName': '测试', 'age': 18}
      extract:
        newUserId: $.id
