- baseInfo:
    api_name: 登录获取 Token
    # url 写相对路径，host 由 configs/config.ini 的 [Host] 提供，方便切换环境
    url: /auth/login
    method: post
    header:
      Content-Type: application/json; charset=utf-8
  testCase:
    - case_name: 正确账号密码登录成功
      json:
        username: emilys
        password: emilyspass
        expiresInMins: 60
      validation:
        - code: 200
        - eq: {'id': 1, 'username': 'emilys'}
        - ne: {'accessToken': ''}
        - contain: {'email': 'emily.johnson@x.dummyjson.com'}
      extract:
        accessToken: $.accessToken
        refreshToken: $.refreshToken
        username: $.username
        userId: $.id

    - case_name: 密码错误登录失败
      json:
        username: emilys
        password: wrong_password
        expiresInMins: 60
      validation:
        - code: 400
        - contain: {'message': 'Invalid credentials'}
