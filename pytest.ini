[pytest]

# 报告产物统一输出到 report/temps，--clean-alluredir 每次执行前清空旧数据
addopts = -v --alluredir=./report/temps --clean-alluredir

# 全量收集 testcase 下的用例；只想跑某个模块时，用 pytest testcase/login 指定路径
testpaths = ./testcase

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 参数化用例的中文 id 不做 unicode 转义，报告里显示中文
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

# 注册自定义标记，避免 pytest 报 PytestUnknownMarkWarning
markers =
    api: 接口测试
    web: UI测试
    ut: 单元测试
    login: 登录相关
    pay: 支付相关
    ddt: 参数化
